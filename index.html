<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Reloaded | Retro 8-Bit HTML5 Canvas Arcade Game</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Play Snake Reloaded, a browser-based classic snake arcade game featuring a stunning cyberpunk neon aesthetic, custom particle sparks, synthesized Web Audio sound effects, and a realistic CRT mode." />
  <meta name="keywords" content="snake game, html5 game, canvas game, retro arcade, chiptune synth, vanilla javascript, web audio api, crt scanlines" />
  <meta name="author" content="stonedhawk" />
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Snake Reloaded | Retro 8-Bit HTML5 Canvas Arcade Game" />
  <meta property="og:description" content="A browser-based classic snake game with a modern retro neon aesthetic. Playable directly with zero dependencies." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="screenshot.png" />
  
  <!-- External CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="game-container">
    
    <!-- Title Header -->
    <header>
      <h1 class="brand-title">SNAKE</h1>
      <p class="brand-subtitle">R E L O A D E D</p>
    </header>

    <!-- Retro Arcade Cabinet Frame -->
    <section class="arcade-cabinet crt-active" id="arcadeCabinet">
      
      <!-- HUD Dashboard Banner -->
      <div class="hud-panel">
        <div class="hud-item">
          <span class="hud-label">SCORE</span>
          <span class="hud-val" id="score">0000</span>
        </div>
        
        <div class="hud-speed" id="speedLabel">CHILL (LVL 1)</div>
        
        <div class="hud-item right-aligned">
          <span class="hud-label">BEST RECORD</span>
          <span class="hud-val" id="highScore">0000</span>
        </div>
      </div>

      <!-- Main Game Canvas Rendering Screen -->
      <canvas id="gameCanvas" width="600" height="600"></canvas>

    </section>

    <!-- Arcade Bezel Interactive Control Panel Dashboard -->
    <section class="dashboard-panel" id="dashboardPanel">
      <div class="controls-tips">
        <p>🎮 <strong>CONTROLS:</strong> [W][A][S][D] / [ARROWS] to Navigate</p>
        <p>⚡ <strong>UTILITIES:</strong> [SPACE] to Play/Replay  |  [P] / [ESC] to Pause</p>
      </div>

      <div class="btn-group">
        <!-- Mechanical Toggle Buttons -->
        <button class="arcade-btn red-glow" id="muteBtn" aria-label="Mute Audio Toggle">
          🔊 AUDIO: ON
        </button>
        <button class="arcade-btn green-glow" id="crtBtn" aria-label="CRT Monitor Filter Toggle">
          📺 CRT: ON
        </button>
      </div>
    </section>

  </main>

  <!-- Game Scripts Modular Loadout (Ensuring file:// compatibility without CORS restrictions) -->
  <script src="js/constants.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/game.js"></script>

  <!-- Startup Orchestrator -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Boot up the main engine
      GameEngine.init();
    });
  </script>

</body>
</html>
